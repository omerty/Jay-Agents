<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Sign in — JayAgents</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><defs><linearGradient id='g' x1='0' y1='0' x2='1' y2='1'><stop offset='0%25' stop-color='%234f8cff'/><stop offset='100%25' stop-color='%238b5cf6'/></linearGradient></defs><rect width='32' height='32' rx='8' fill='url(%23g)'/><text x='16' y='21' text-anchor='middle' fill='white' font-family='system-ui' font-weight='800' font-size='11'>JA</text></svg>" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="style.css" />
</head>
<body class="auth-page">
<div class="auth-shell">
  <div class="auth-card">
    <div class="auth-brand">
      <div class="brand-mark">JA</div>
      <div>
        <div class="brand-name">JayAgents</div>
        <div class="brand-sub">AI Prospecting Dashboard</div>
      </div>
    </div>

    <div class="auth-tabs">
      <button class="auth-tab active" type="button" data-tab="login">Sign in</button>
      <button class="auth-tab" type="button" data-tab="signup">Create account</button>
    </div>

    <form id="login-form" class="auth-form">
      <label class="auth-label" for="login-email">Email</label>
      <input id="login-email" class="auth-input" type="email" autocomplete="username" required />

      <label class="auth-label" for="login-password">Password</label>
      <input id="login-password" class="auth-input" type="password" autocomplete="current-password" required />

      <button class="btn primary auth-submit" type="submit">Sign in</button>
    </form>

    <form id="signup-form" class="auth-form hidden">
      <p class="auth-hint">Use the one-time invite code your admin sent you, then choose a permanent password.</p>

      <label class="auth-label" for="signup-email">Email</label>
      <input id="signup-email" class="auth-input" type="email" autocomplete="username" required />

      <label class="auth-label" for="signup-otp">Invite code</label>
      <input id="signup-otp" class="auth-input" type="text" autocomplete="one-time-code" required />

      <label class="auth-label" for="signup-password">New password</label>
      <input id="signup-password" class="auth-input" type="password" autocomplete="new-password" minlength="10" required />

      <label class="auth-label" for="signup-password2">Confirm password</label>
      <input id="signup-password2" class="auth-input" type="password" autocomplete="new-password" minlength="10" required />

      <button class="btn primary auth-submit" type="submit">Create account</button>
    </form>

    <div class="auth-error hidden" id="auth-error"></div>
  </div>
</div>
<script src="auth.js?v=1"></script>
</body>
</html>
